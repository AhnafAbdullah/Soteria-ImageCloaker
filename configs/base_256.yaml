# First real run: 256 px, one surrogate per family, ~4-6 h on a Colab T4.
image_size: 256
eps: 0.03137          # 8/255
mask_min: 0.3

vae: [sd15]
clip: [vit_b16_laion]
face: [arcface_ir101]
ghost_std: 0.03

w_vae: 1.0
w_clip: 1.0
w_face: 1.0
w_lpips: 10.0
lpips_budget: 0.05

batch_size: 16
steps: 20000
lr: 2.0e-4
warmup_steps: 500
curriculum_frac: 0.2

log_every: 50
val_every: 500
ckpt_every: 500
budget_min: 330       # stop cleanly before a 6 h Colab session ends

data_root: /content/data/prepared
out_dir: /content/drive/MyDrive/soteria/runs/base_256
